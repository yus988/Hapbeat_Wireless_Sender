; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
build_flags = 
	-std=gnu++17
	-I "include"
	; -D ENABLE_DEBUG
lib_deps = 
	SPI
	adafruit/Adafruit TCS34725@^1.4.4

[env:M5Stack_basic-Repeater]
board = m5stack-core-esp32
build_flags = 
	${env.build_flags}
	-D M5STACK_BASIC
	-D ENABLE_DISPLAY
	-D REPEATER	
	-D ENABLE_DEBUG
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

[env:M5Stack_basic]
board = m5stack-core-esp32
build_flags = 
	${env.build_flags}
	-D M5STACK_BASIC
	-D ENABLE_DISPLAY
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

; ATOM

; M5 Capsule
[env:M5Capsule-AccelmImpact]
board = m5stack-stamps3
build_flags = 
	${env.build_flags}
	-D M5STAMP_S3
	-D ENABLE_ACCELOMETOR
	-D M5CAPSULE
	-D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
	${env.lib_deps}
	bblanchon/ArduinoJson@^7.1.0
	fastled/FastLED@3.7.0
	sparkfun/SparkFun BMI270 Arduino Library @ ^1.0.3
	m5stack/M5Unified@^0.2.2

[env:M5StackCoreS3]
board = m5stack-cores3
build_flags = 
	${env.build_flags}
	-D M5STACK_CORE_S3
	-D ENABLE_DISPLAY
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

[env:M5StampS3]
board = m5stack-stamps3
build_flags = 
	${env.build_flags}
	-D M5STAMP_S3
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

[env:M5Stick_C]
board = m5stick-c
build_flags = 
	${env.build_flags}
	-D M5STICK_C
	-D ENABLE_DISPLAY
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

[env:M5Stamp_C3]
board = esp32-c3-devkitm-1
build_flags = 
	${env.build_flags}
	-D M5STAMP_C3_MATE
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2
