; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 普段使わない env は platformio.optional.ini に退避しています。
; 一覧に出したいときだけ次の1行を有効化してください:
; extra_configs = platformio.optional.ini

[env]
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
; デフォルトでは通常の src/main.cpp を使う（XIAO用の最小mainは除外）
build_src_filter =
	+<*> -<audio_stream_main.cpp>
build_flags = 
	-std=gnu++17
	-I "include"
	; -D ENABLE_DEBUG
lib_deps = 
	SPI
	adafruit/Adafruit TCS34725@^1.4.4

[env:M5Stack_basic-Repeater]
board = m5stack-core-esp32
build_flags = 
	${env.build_flags}
	-D M5STACK_BASIC
	-D ENABLE_DISPLAY
	-D REPEATER	
	-D ENABLE_DEBUG
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

[env:M5Stack_basic]
board = m5stack-core-esp32
build_flags = 
	${env.build_flags}
	-D M5STACK_BASIC
	-D ENABLE_DISPLAY
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

; ATOM

; M5 Capsule
[env:M5Capsule-AccelmImpact]
board = m5stack-stamps3
build_flags = 
	${env.build_flags}
	-D M5STAMP_S3
	-D ENABLE_ACCELOMETOR
	-D M5CAPSULE
	-D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
	${env.lib_deps}
	bblanchon/ArduinoJson@^7.1.0
	fastled/FastLED@3.7.0
	sparkfun/SparkFun BMI270 Arduino Library @ ^1.0.3
	m5stack/M5Unified@^0.2.2

; ; ; ; ; ; ; Audio Streaming ; ; ; ; ; ; ; ; ;
[env:M5StampS3_AudioStream_ADC]
board = m5stack-stamps3
build_flags = 
	${env.build_flags}
	-D M5STAMP_S3
	-D ENABLE_AUDIO_STREAM
	-D STREAM_SOURCE_ADC
	-D STREAM_ADC_PIN_L=1
	-D STREAM_ADC_PIN_R=2
	-D STREAM_SAMPLE_RATE=8000
	-D FRAMES_PER_PACKET=40
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

[env:M5Stack_basic_AudioStream_Serial]
board = m5stack-core-esp32
monitor_speed = 921600
build_flags = 
	${env.build_flags}
	-D M5STACK_BASIC
	-D ENABLE_DISPLAY
	-D ENABLE_AUDIO_STREAM
	-D STREAM_SOURCE_SERIAL
	-D STREAM_SAMPLE_RATE=8000
	-D FRAMES_PER_PACKET=40
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@^0.2.2

; XIAO ESP32C3 (Serial -> ESP-NOW stream)
[env:XIAO_ESP32C3_AudioStream_Serial]
board = seeed_xiao_esp32c3
build_flags = 
	${env.build_flags}
	-D ENABLE_AUDIO_STREAM
	-D STREAM_SOURCE_SERIAL
	-D STREAM_SAMPLE_RATE=8000
	-D FRAMES_PER_PACKET=40
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
	+<audio_stream_main.cpp> -<main.cpp> +<adjustParams.cpp>
lib_ignore =
	AccelmImpactDetector
	M5UImanager
	AccelTrigger
	ColorSensor
	XcontrollerESP32
lib_deps =
